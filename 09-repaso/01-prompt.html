<script>
  const n1 = Number(prompt("Introduce el primer número"));
  const n2 = Number(prompt("Introduce el segundo número"));
  const op = prompt("Introduce a operacion a realizar");

  if (op === "+") {
    alert(n1 + n2);
  } else if (op === "-") {
    alert(n1 - n2);
  } else if (op === "*") {
    alert(n1 * n2);
  } else if (op === "/") {
    alert(n1 / n2);
  }
</script>
