<script>
  const numeroDNI = prompt("Introduce el número del DNI");
  const getDNILetter = (number) => {
    if (number.length === 8 && !isNaN(number)) {
      const resto = number % 23;
      const letra = "TRWAGMYFPDXBNJZSQVHLCKE".charAt(resto);
      return letra;
    } else {
      return null;
    }
  };

  const l = getDNILetter(numeroDNI);
  alert(l);

</script>
